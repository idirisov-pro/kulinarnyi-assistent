name: apply-preview5-checkup

on:
  push:
    branches: [agent/preview-5-full-checkup]
    paths:
      - '.github/workflows/apply-preview5-checkup.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preview-5-full-checkup

      - name: Reassemble verified package
        shell: bash
        run: |
          cat .preview5/package.part* | base64 -d > /tmp/preview5_changes.tar.gz
          echo 'c95a13d88e83e80e68058771258d070bd0de1ea962cc4828b5a8fb5e257bd997  /tmp/preview5_changes.tar.gz' | sha256sum -c -
          tar -xzf /tmp/preview5_changes.tar.gz

      - name: Validate preview.5
        shell: bash
        run: |
          node --check app.js
          node --check search-utils.js
          node --check service-worker.js
          node --check quality-check.mjs
          node quality-check.mjs
          node scripts/validate-data.js

      - name: Commit clean product package
        shell: bash
        run: |
          rm -rf .preview5 .github/workflows/apply-preview5-checkup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare 3.0-preview.5 after full application check-up'
          git push origin HEAD:agent/preview-5-full-checkup
