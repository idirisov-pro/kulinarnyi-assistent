name: apply-preview5-checkup

on:
  push:
    branches: [agent/preview-5-full-checkup]
    paths:
      - '.github/workflows/apply-preview5-checkup.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preview-5-full-checkup

      - name: Apply verified preview.5 package
        shell: bash
        run: |
          cat > /tmp/preview5.b64 <<'PAYLOAD'
 b... 
PAYLOAD
          base64 -d /tmp/preview5.b64 | tar -xz
          node --check app.js
          node --check search-utils.js
          node --check service-worker.js
          node --check quality-check.mjs
          node quality-check.mjs
          node scripts/validate-data.js

      - name: Commit preview.5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_DEPLOY.md WHATSAPP_INVITATION.txt app.js index.html manifest.webmanifest service-worker.js quality-check.mjs preview5.css search-utils.js docs/FEEDBACK_v3_preview5.md
          git commit -m "Prepare 3.0-preview.5 after full application check-up"
          git push origin HEAD:agent/preview-5-full-checkup
