name: apply-preview4-qa-hotfix

on:
  push:
    branches: [agent/preview4-qa-hotfix]
    paths:
      - '.github/workflows/apply-preview4-qa-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preview4-qa-hotfix

      - name: Apply verified QA hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app.js')
          app = app_path.read_text()

          old = """    const additions = requiredAdditionNames(evaluation);\n    const recommended = recommendedNames(evaluation);\n"""
          new = """    const additions = requiredAdditionNames(evaluation);\n    const hasMissingRequired = additions.length > 0;\n    const timeMismatch = recipe.totalMinutes > settings.maxTime;\n    const recommended = recommendedNames(evaluation);\n"""
          assert old in app
          app = app.replace(old, new, 1)

          old = """    if (criticalMissing.length) {\n      availabilityClass = 'warning-state';\n      availabilityTitle = 'Перед приготовлением нужно добавить основной продукт';\n      availabilityDetails = `Добавьте: ${criticalMissing.join(', ')}.`;\n    } else if (additions.length) {\n      availabilityClass = 'warning-state';\n      availabilityTitle = 'Перед приготовлением проверьте продукты';\n      availabilityDetails = `Нужно добавить: ${additions.join(', ')}.`;\n    }\n    if (recommended.length) availabilityDetails += ` Для лучшего результата рекомендуется: ${recommended.join(', ')}.`;\n"""
          new = """    if (criticalMissing.length) {\n      availabilityClass = 'warning-state';\n      availabilityTitle = 'Перед приготовлением нужно добавить основной продукт';\n      availabilityDetails = `Добавьте: ${criticalMissing.join(', ')}.`;\n    } else if (additions.length) {\n      availabilityClass = 'warning-state';\n      availabilityTitle = 'Перед приготовлением проверьте продукты';\n      availabilityDetails = `Нужно добавить: ${additions.join(', ')}.`;\n    } else if (timeMismatch) {\n      availabilityClass = 'warning-state';\n      availabilityTitle = 'Рецепту нужно больше времени';\n      availabilityDetails = `Нужно около ${recipe.totalMinutes} минут, а в подборе был выбран лимит ${settings.maxTime} минут.`;\n    }\n    if (timeMismatch && hasMissingRequired) availabilityDetails += ` Также нужно около ${recipe.totalMinutes} минут вместо выбранных ${settings.maxTime}.`;\n    if (recommended.length) availabilityDetails += ` Для лучшего результата рекомендуется: ${recommended.join(', ')}.`;\n"""
          assert old in app
          app = app.replace(old, new, 1)

          old = '''        <button id="startCooking" class="primary-button" type="button">Начать готовить</button>'''
          new = '''        <button id="startCooking" class="primary-button" type="button" ${hasMissingRequired ? 'disabled' : ''}>${hasMissingRequired ? 'Сначала добавьте обязательные продукты' : 'Начать готовить'}</button>'''
          assert old in app
          app = app.replace(old, new, 1)
          app_path.write_text(app)

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text()
          old_cache = "const CACHE_NAME = 'culinary-assistant-v3-preview-4';"
          new_cache = "const CACHE_NAME = 'culinary-assistant-v3-preview-4-hotfix-1';"
          assert old_cache in sw
          sw_path.write_text(sw.replace(old_cache, new_cache, 1))

          qc_path = Path('quality-check.mjs')
          qc = qc_path.read_text()
          marker = "const failed = results.filter(item => !item.passed);"
          assert marker in qc
          extra = """check('Блокировка готовки без обязательных продуктов', app.includes(\"hasMissingRequired ? 'disabled' : ''\") && app.includes('Сначала добавьте обязательные продукты'), 'пошаговый режим не стартует при отсутствии обязательных ингредиентов');\ncheck('Предупреждение о превышении времени', app.includes('Рецепту нужно больше времени') && app.includes('timeMismatch'), 'карточка рецепта сохраняет контекст ограничения по времени');\n\n"""
          qc_path.write_text(qc.replace(marker, extra + marker, 1))

          doc_path = Path('docs/FEEDBACK_v3_preview4.md')
          doc = doc_path.read_text()
          appendix = """\n\n## QA hotfix 2026-08-11\n\nКонтрольный сценарий в Chromium выявил два дефекта карточки рецепта:\n\n- при отсутствии обязательного ингредиента кнопка «Начать готовить» оставалась активной; теперь она блокируется до добавления обязательных продуктов;\n- при открытии близкого варианта, который превышает выбранный лимит времени, карточка теряла это ограничение; теперь предупреждение о времени сохраняется.\n\nService Worker cache обновлён отдельным hotfix-ключом, чтобы уже открывавшие preview.4 пользователи получили исправленный `app.js`, а не старую копию из cache-first.\n"""
          if '## QA hotfix 2026-08-11' not in doc:
              doc_path.write_text(doc + appendix)
          PY

          node --check app.js
          node --check service-worker.js
          node --check quality-check.mjs
          node quality-check.mjs

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js service-worker.js quality-check.mjs docs/FEEDBACK_v3_preview4.md
          git commit -m "Fix cooking guard and time context after QA"
          git push origin HEAD:agent/preview4-qa-hotfix
