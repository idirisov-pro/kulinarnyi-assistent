name: logo-trace-guard
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-logo:
    if: github.head_ref == 'agent/exact-approved-logo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure approved trace and cache-bust are present
        run: |
          grep -q 'M 93 334' icons/icon.svg
          grep -q 'brand3' index.html
          grep -q 'brand3' manifest.webmanifest
          grep -q 'public-beta-brand-3' service-worker.js
          node quality-check.mjs
