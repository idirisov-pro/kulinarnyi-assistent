name: apply-public-beta-launch

on:
  push:
    branches: [agent/public-beta-launch-ready]
    paths:
      - '.github/workflows/apply-public-beta-launch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-beta-launch-ready

      - name: Apply transition
        run: python scripts/apply_public_beta.py

      - name: Validate
        run: |
          rm -f WHATSAPP_INVITATION.txt
          node --check app.js
          node --check service-worker.js
          node --check quality-check.mjs
          node quality-check.mjs
          node scripts/validate-data.js

      - name: Commit clean transition
        run: |
          rm -f scripts/apply_public_beta.py .github/workflows/apply-public-beta-launch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare 3.0-preview.5 for open public beta'
          git push origin HEAD:agent/public-beta-launch-ready
